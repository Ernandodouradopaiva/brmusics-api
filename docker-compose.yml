services:
  brmusics-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ernandopaiva/brmusics-api:1.0.3
    container_name: brmusics-api
    hostname: brmusics-api
    ports:
      - "8082:8081"
    restart: always
    env_file:
      - ./config/brmusics-api.prod.env
    environment:
      APP_API_INTERNAL_URL: http://brmusics-api:8081
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3002,http://181.215.134.218:3002
      SPRING_PROFILES_ACTIVE: prod
      BRMUSICS_STORAGE_LOCAL_ANEXOS: /opt/brmusics/anexos
    networks:
      - brmusics-net

    volumes:
      - /opt/brmusics/anexos:/opt/brmusics/anexos

networks:
  brmusics-net:
    name: brmusics-net
    external: true
