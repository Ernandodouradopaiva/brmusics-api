services:
  brmusics-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ernandopaiva/brmusics-api:1.0.0
    container_name: brmusics-api
    hostname: brmusics-api
    ports:
      - "8082:8081"
    restart: always
    env_file:
      - ./config/brmusics-api.prod.env
    environment:
      APP_API_INTERNAL_URL: http://brmusics-api:8081
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3002
    networks:
      - brmusics-net

networks:
  brmusics-net:
    name: brmusics-net
    external: true
